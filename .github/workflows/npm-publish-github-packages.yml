# Publishes a GitHub-Packages-scoped copy of this package (@vaporjawn/regexplay) to
# npm.pkg.github.com so it shows up under https://github.com/Vaporjawn?tab=packages.
# This repo has no existing npm-publish workflow at all (regexplay is published to
# npmjs.com manually via `npm run release`), so this is purely additive.
#
# Uses `npm install` rather than `npm ci`: package-lock.json is gitignored in this
# repo, so there's no lockfile to install from (this is also why ci.yml's `npm ci`
# step has been failing on every run). --ignore-scripts skips prepublishOnly (which
# runs the full test/lint suite) since that's already covered by ci.yml on every push.
name: Publish to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com
      - run: npm install
      - name: Scope package name for GitHub Packages
        run: npm pkg set name="@vaporjawn/regexplay"
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
